[workspace]
members = [
  "./crates/gpui/",
  "./crates/gpui_render/",
  "./crates/gpui_web/",
  "./crates/gpui_wgpu/",
  "./crates/gpui_ce_parley/",
  "./crates/gpui_linux/",
  "./crates/gpui_macos/",
  "./crates/gpui_apple/",
  "./crates/gpui_tokio/",
  "./crates/gpui_macros/",
  "./crates/gpui_windows/",
  "./crates/gpui_platform/",
  "./crates/gpui_shared_string/",
  "./crates/gpui_elements/",
  "./crates/gpui_ce_fonts/",
  "./crates/gpui_collections/",
  "./crates/gpui_refineable/",
  "./crates/gpui_derive_refineable/",
  "./crates/gpui_scheduler/",
  "./crates/gpui_sum_tree/",
  "./crates/gpui_media/",
  "./crates/gpui_zed_util/",
  "./crates/gpui_ce_util/",
  "./crates/gpui_path/",
  "./tooling/perf/",
]
default-members = ["./crates/gpui/"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "A community fork of Zed's GPU-accelerated UI framework"
publish = ["unity"]
license = "Apache-2.0"
homepage = "https://gpui-ce.github.io/"
readme = "README.md"

[workspace.dependencies]
accesskit = { version = "0.25.1", features = ["enumn"] }
accesskit_consumer = "0.39.1"
accesskit_macos = "0.27.1"
accesskit_unix = "0.24.0"
accesskit_windows = "0.35.1"
anyhow = "1.0.86"
async-task = "4.7"
backtrace = "0.3"
bitflags = "2.6.0"
collections = { path = "crates/gpui_collections", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_collections" }
dunce = "1.0"
etagere = "0.2"
fontique = { version = "0.12.0", default-features = false }
parley = { version = "0.12", default-features = false, features = ["std"] }
linebender_resource_handle = "0.1.1"
heapless = "0.9.2"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
swash = "0.2.6"
tempfile = "3.20.0"
unicode-bidi = { version = "0.3.18", default-features = false, features = [
  "hardcoded-data",
] }
ctor = "1.0.6"
derive_setters = "0.1.9"
derive_more = { version = "2.1.1", features = [
  "add",
  "add_assign",
  "deref",
  "deref_mut",
  "display",
  "from_str",
  "mul",
  "mul_assign",
  "not",
] }
futures = "0.3.32"
futures-concurrency = "7.7.1"
flume = "0.12"
http = "1.3"
# Only the formats gpui's `ImageFormat` maps, plus `rayon` for the parallel
# JPEG decoder. The crate's default set also enables `avif`, an AVIF *encoder*
# (ravif/rav1e, ~28 crates) that nothing here calls (decoding AVIF needs
# `avif-native`), and `exr`/`dds`/`hdr`/`qoi`/`tga`/`ff`, which no
# `ImageFormat` variant reaches.
image = { version = "0.25.1", default-features = false, features = [
  "rayon",
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "tiff",
  "webp",
] }
inventory = "0.3.19"
itertools = "0.14.0"
log = { version = "0.4.29", features = ["kv_unstable_serde", "serde"] }
palette = { version = "0.7.6", features = ["serializing"] }
parking_lot = "0.12.1"
phf = { version = "0.13.1", features = ["macros"] }
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { version = "1.10", features = ["attr-macro"] }
chrono = { version = "0.4", features = ["serde"] }
profiling = "1"
rand = "0.10.3"
regex = "1.5"
refineable = { path = "crates/gpui_refineable", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_refineable" }
scheduler = { path = "crates/gpui_scheduler", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_scheduler" }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = "2.5.0"
stacksafe = "1.0"
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { path = "crates/gpui_sum_tree", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_sum_tree" }
thiserror = "2.0.12"
tracing = { version = "0.1.44", features = ["attributes"] }
hdrhistogram = "7"
pollster = "0.4.0"
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
web-time = "1.1.0"
skrifa = "0.44.0"
block = "0.1"
block2 = "0.6"
cbindgen = { version = "0.28.0", default-features = false }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
foreign-types = "0.5"
media = { path = "crates/gpui_media", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_media" }
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSArray",
  "NSAutoreleasePool",
  "NSAttributedString",
  "NSBundle",
  "NSCoder",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSNull",
  "NSObjCRuntime",
  "NSObject",
  "NSProcessInfo",
  "NSRange",
  "NSRunLoop",
  "NSSet",
  "NSString",
  "NSThread",
  "NSURL",
  "NSUndoManager",
  "NSUserDefaults",
  "NSValue",
  "objc2-core-foundation",
  "std",
] }
objc2-user-notifications = "0.3"
mach2 = "0.5"
metal = "0.33"
windows-capture = "2.0.1"
env_logger = "0.11"
unicode-segmentation = "1.10"

wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
notify-rust = "4"
heck = "0.5"
proc-macro2 = "1.0.101"
syn = { version = "2.0.117", features = ["full", "extra-traits", "visit-mut"] }
quote = "1.0.41"
ashpd = { version = "0.14", default-features = false, features = [
  "async-io",
  "notification",
  "open_uri",
  "file_chooser",
  "settings",
  "trash",
] }
libc = "0.2"
smol = "2.0"
util = { path = "crates/gpui_zed_util", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_zed_util" }
wgpu = "30.0.1"
# The crates.io release, not a git pin: `cargo publish` rejects git
# dependencies, and the Unity registry publish needs every dependency in a
# registry. Exact, because wgsl-rs is pre-1.0 and its betas change the API.
# No `validation` here: it only backs the `#[cfg(test)]` validation tests the
# `#[wgsl]` macro generates, so it pulls naga into every consumer's normal build
# for nothing. gpui_render, the one crate with `#[wgsl]` modules, enables it as
# a dev-dependency instead, and its build.rs already validates every pipeline's
# WGSL with this workspace's naga on every build.
wgsl-rs = { version = "=0.1.0-beta.6", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSAlert",
  "NSApplication",
  "NSDocumentController",
  "NSAppearance",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSHapticFeedback",
  "NSCursor",
  "NSPanel",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSSavePanel",
  "NSScroller",
  "NSWorkspace",
  "NSVisualEffectView",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSTextInputClient",
  "NSView",
  "NSWindow",
  "block2",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "CMSampleBuffer",
  "objc2",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "CALayer",
  "CAMetalDisplayLink",
  "CAMetalLayer",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
] }
semver = { version = "1.0", features = ["serde"] }
windows-core = "0.62.2"
tokio = { version = "1" }
gpui_util = { path = "crates/gpui_ce_util", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_util" }

gpui = { path = "./crates/gpui/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui-ce", default-features = false }
gpui_render = { path = "./crates/gpui_render/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_render" }
gpui_platform = { path = "./crates/gpui_platform/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_platform" }
gpui_linux = { path = "./crates/gpui_linux/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_linux", default-features = false }
gpui_macos = { path = "./crates/gpui_macos/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_macos" }
gpui_apple = { path = "./crates/gpui_apple/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_apple" }
gpui_windows = { path = "./crates/gpui_windows/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_windows" }
gpui_web = { path = "./crates/gpui_web/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_web" }
gpui_parley = { path = "./crates/gpui_ce_parley/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_parley", default-features = false }

gpui_wgpu = { path = "./crates/gpui_wgpu/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_wgpu" }

gpui_macros = { path = "./crates/gpui_macros/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_macros" }
gpui_shared_string = { path = "./crates/gpui_shared_string/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_shared_string" }
gpui_tokio = { path = "./crates/gpui_tokio/", version = "=0.4.0-unity.20261112", registry = "unity", package = "gpui_ce_tokio" }

# Third-party crates that were pinned per member. Versions live here; a member
# takes one with `name.workspace = true` and adds only its own features.
as-raw-xcb-connection = "1"
async-fs = "2.1"
