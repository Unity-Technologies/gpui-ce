futures-lite = "2.6.1"
getrandom = "0.4.3"
globset = "0.4"
indexmap = "2"
lyon = "1.0"
memfd = "0.6.5"
naga = "30.0.1"
nix = "0.29"
num_cpus = "1.13"
objc2-metal = "0.3"
oo7 = { version = "0.7", default-features = false }
open = "5.2.0"
parking = "2.0.0"
percent-encoding = "2.3.2"
pin-project = "1.1.10"
pretty_assertions = "1.3.0"
rayon = "1.11.0"
resvg = { version = "0.50.0", default-features = false }
rust-embed = "8.12"
rustc-hash = "2"
seahash = "4.1"
serde_json_lenient = "0.2"
shlex = "1.3.0"
smol_str = "0.3.6"
spin = "0.10.0"
subsecond = "=0.7.10"
taffy = "=0.13.0"
take-until = "0.2.0"
tendril = "0.5"
unicase = "2.6"
usvg = { version = "0.50.0", default-features = false }
waker-fn = "1.2.0"
walkdir = "2.5"
wasm_thread = "0.3.3"
wayland-backend = "0.3.15"
wayland-client = "0.31.11"
wayland-cursor = "0.31.11"
