[package]
name = "gpui_ce_path"
version = "0.4.0-unity.20261112"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
description = "Relative/absolute path types used by gpui-ce (vendored from Zed's path crate)."
repository = "https://github.com/gpui-ce/gpui-ce"

[lib]
name = "path"
path = "src/path.rs"

[features]
test-support = []

[dependencies]
anyhow.workspace = true
dunce.workspace = true
serde = { workspace = true, optional = true, features = ["derive", "rc"] }

[target.'cfg(windows)'.dependencies]
tendril.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
