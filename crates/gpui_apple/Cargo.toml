[package]
name = "gpui_ce_apple"
version = "0.4.0-unity.20261125"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_apple"
path = "src/gpui_apple.rs"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
render-to-image = ["gpui/render-to-image"]

[dependencies]
gpui.workspace = true
gpui_render.workspace = true
wgsl-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block2.workspace = true
collections.workspace = true
etagere.workspace = true
image.workspace = true
log.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-core-video = { workspace = true, features = [
  "objc2",
  "CVMetalTexture",
  "CVMetalTextureCache",
  "CVReturn",
  "objc2-metal",
] }
objc2-foundation = { workspace = true, features = ["NSError", "NSRange", "NSString"] }
objc2-metal.workspace = true
objc2-quartz-core = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-metal",
] }
parking_lot.workspace = true
smallvec.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFString"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVReturn"] }
