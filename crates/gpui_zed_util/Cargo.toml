[package]
name = "gpui_ce_zed_util"
version = "0.4.0-unity.20261102"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
description = "OS/utility helpers used by gpui-ce platform backends (vendored from Zed's util)."
repository = "https://github.com/gpui-ce/gpui-ce"

[lib]
name = "util"
path = "src/util.rs"
doctest = true

[features]
test-support = ["dep:rand", "path/test-support"]
# Embed `fs_embed!` assets at compile time even in debug builds.
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
anyhow.workspace = true
async_zip = { workspace = true, features = ["deflate", "deflate64"] }
collections = { package = "gpui_ce_collections", version = "=0.4.0-unity.20261102", registry = "unity", path = "../gpui_collections" }
dunce.workspace = true
futures-lite.workspace = true
futures.workspace = true
globset.workspace = true
itertools.workspace = true
log = { workspace = true, features = ["kv_unstable_serde", "serde"] }
rand = { workspace = true, optional = true }
regex.workspace = true
rust-embed = { workspace = true, features = ["include-exclude"] }
schemars = { workspace = true, features = ["indexmap2"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_json_lenient = { workspace = true, features = [
  "preserve_order",
  "raw_value",
] }
shlex.workspace = true
take-until.workspace = true
tempfile.workspace = true
unicase.workspace = true
url.workspace = true
percent-encoding.workspace = true
gpui_util = { package = "gpui_ce_util", version = "=0.4.0-unity.20261102", registry = "unity", path = "../gpui_ce_util" }
path = { package = "gpui_ce_path", version = "=0.4.0-unity.20261102", registry = "unity", path = "../gpui_path", features = [
  "serde",
] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
which.workspace = true
async-fs.workspace = true
walkdir.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["unstable"] }
rand.workspace = true
path = { package = "gpui_ce_path", version = "=0.4.0-unity.20261102", registry = "unity", path = "../gpui_path", features = [
  "test-support",
] }
