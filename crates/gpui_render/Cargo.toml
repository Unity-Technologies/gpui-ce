[package]
name = "gpui_ce_render"
version = "0.4.0-unity.20261019"
description.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/gpui_render.rs"

[features]
default = []
swash = ["dep:anyhow", "dep:skrifa", "dep:swash", "dep:thiserror"]

[dependencies]
anyhow = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true, features = ["std"] }
swash = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
gpui = { path = "../gpui", version = "=0.4.0-unity.20261019", registry = "unity", package = "gpui-ce", default-features = false }
smallvec.workspace = true
wgsl-rs.workspace = true

[target.'cfg(windows)'.build-dependencies]
windows.workspace = true

[build-dependencies]
naga = { version = "30.0.1", features = [
  "glsl-out",
  "hlsl-out",
  "msl-out",
  "wgsl-in",
] }
naga-old = { package = "naga", version = "24.0.0", features = [
  "hlsl-out",
  "wgsl-in",
] }
gpui = { path = "../gpui", version = "=0.4.0-unity.20261019", registry = "unity", package = "gpui-ce", default-features = false }
wgsl-rs.workspace = true

[dev-dependencies]
criterion.workspace = true
unicode-segmentation.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_parley = { workspace = true, features = ["test-support"] }
gpui_fonts = { path = "../gpui_ce_fonts", package = "gpui-ce-fonts" }
naga = { version = "30.0.1", features = ["wgsl-in"] }
# The `#[wgsl]` modules' generated `#[cfg(test)]` validation tests call
# `Source::validate`, which only exists with this feature. Enabling it here
# keeps those tests while leaving naga out of wgsl-rs's normal builds.
wgsl-rs = { workspace = true, features = ["validation"] }

[[bench]]
name = "glyph_rasterization"
harness = false
required-features = ["swash"]
