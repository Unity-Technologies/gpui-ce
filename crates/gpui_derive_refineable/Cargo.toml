[package]
name = "gpui_ce_derive_refineable"
version = "0.4.0-unity.20261102"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
description = "Derive macro for gpui-ce's Refineable (vendored from Zed)."

[lib]
name = "derive_refineable"
path = "src/derive_refineable.rs"
proc-macro = true
doctest = false

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "visit-mut"] }
