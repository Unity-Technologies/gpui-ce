[package]
name = "gpui_ce_media"
version = "0.4.0-unity.20261125"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
description = "macOS CoreMedia/CoreVideo bindings for gpui-ce (vendored from Zed)."

[lib]
name = "media"
path = "src/media.rs"
doctest = false

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc.workspace = true

# build.rs only generates bindings on macOS, but it checks the target at run
# time, so every host compiles it and needs bindgen.
[build-dependencies]
bindgen.workspace = true
