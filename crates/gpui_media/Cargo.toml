[package]
name = "gpui_ce_media"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "macOS CoreMedia/CoreVideo bindings for gpui-ce (vendored from Zed)."

[lib]
name = "media"
path = "src/media.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-metal.workspace = true

# build.rs only generates bindings on macOS.
[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"
