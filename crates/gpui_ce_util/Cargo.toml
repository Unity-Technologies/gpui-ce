[package]
name = "gpui_ce_util"
version = "0.4.0-unity.20261102"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
description = "Utility structs and functions used by gpui-ce (vendored from Zed's gpui_util)."
repository = "https://github.com/gpui-ce/gpui-ce"

[lib]
name = "gpui_util"
path = "src/lib.rs"

[dependencies]
log = { workspace = true, features = ["kv_unstable_serde", "serde"] }
anyhow.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
which.workspace = true
