[package]
name = "gpui_ce_linux"
version = "0.4.0-unity.20261112"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
# Reads a window’s frame back through the WGPU renderer’s offscreen readback
# (`Window::render_to_image`) without the rest of `test-support`.
render-to-image = ["gpui/render-to-image", "gpui_wgpu?/render-to-image"]
wayland = [
  "bitflags",
  "gpui_wgpu",
  "ashpd/wayland",

  "calloop-wayland-source",
  "memfd",
  "wayland-backend",
  "wayland-client",
  "wayland-cursor",
  "wayland-protocols",
  "wayland-protocols-plasma",
  "wayland-protocols-wlr",
  "filedescriptor",
  "xkbcommon/wayland",
  "open",
  "gpui/wayland",
]
x11 = [
  "gpui_wgpu",
  "ashpd",

  "as-raw-xcb-connection",
  "x11rb",
  "xkbcommon/x11",
  "xim",
  "x11-clipboard",
  "filedescriptor",
  "open",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
collections.workspace = true
image.workspace = true
futures.workspace = true
gpui = { workspace = true, default-features = false }
gpui_util.workspace = true
gpui_render = { workspace = true, features = ["swash"] }
gpui_parley = { workspace = true, features = ["system-fonts"] }
gpui_wgpu = { workspace = true, optional = true }
itertools.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
url.workspace = true
uuid.workspace = true

# Always used
oo7 = { workspace = true, features = ["async-std", "native_crypto"] }
calloop.workspace = true
notify-rust.workspace = true
raw-window-handle.workspace = true

# Used in both windowing options
ashpd = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
filedescriptor = { workspace = true, optional = true }
open = { workspace = true, optional = true }
xkbcommon = { workspace = true, optional = true }

# Screen capture

# Wayland
calloop-wayland-source = { workspace = true, optional = true }
memfd = { workspace = true, optional = true }
wayland-backend = { workspace = true, optional = true, features = [
  "client_system",
  "dlopen",
  "log",
] }
wayland-client = { workspace = true, optional = true }
wayland-cursor = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true, features = [
  "client",
  "staging",
  "unstable",
] }
wayland-protocols-plasma = { workspace = true, optional = true, features = [
  "client",
] }
wayland-protocols-wlr = { workspace = true, optional = true, features = [
  "client",
] }

# X11
as-raw-xcb-connection = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true, features = [
  "allow-unsafe-code",
  "xkb",
  "randr",
  "xinput",
  "cursor",
  "resource_manager",
  "sync",
  "dri3",
] }
xim = { workspace = true, optional = true, features = [
  "x11rb-xcb",
  "x11rb-client",
] }
x11-clipboard = { workspace = true, optional = true }

[package.metadata.cargo-shear]
ignored = ["bitflags", "scap", "x11-clipboard"]
