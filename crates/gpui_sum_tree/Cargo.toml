[package]
name = "gpui_ce_sum_tree"
version = "0.4.0-unity.20261102"
edition = "2024"
license = "Apache-2.0"
description = "Copy-on-write B+ tree with monoidal summaries for gpui-ce (vendored from Zed)."
publish.workspace = true

[lib]
name = "sum_tree"
path = "src/sum_tree.rs"
doctest = false

[dependencies]
heapless.workspace = true
rayon.workspace = true
log.workspace = true
tracing = { workspace = true, features = ["attributes"] }
proptest = { workspace = true, optional = true, features = ["attr-macro"] }

[dev-dependencies]
rand.workspace = true
proptest = { workspace = true, features = ["attr-macro"] }

[features]
test-support = ["proptest"]

[package.metadata.cargo-shear]
ignored = ["tracing"]
