# Security audit workflow: RustSec advisories and cargo-deny policy, on any
# change to the dependency graph or the audit config.
name: Security Audit

on:
  push:
    branches: [unity/hub-consolidated, unity/hub-4.0]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - audit.toml
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - audit.toml
      - deny.toml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # cargo-audit: vulnerability scanning (advisory DB)
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .

  # cargo-deny: license compliance + advisory + duplicate detection
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml
